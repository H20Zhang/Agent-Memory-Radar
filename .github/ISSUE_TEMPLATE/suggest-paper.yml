name: Suggest an Agent Memory paper
description: Suggest a paper that materially changes how an AI agent writes, organizes, retrieves, updates, evolves, or evaluates persistent memory.
title: "[Paper] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Agent Memory Radar. We prioritize work where **persistent or managed memory is central** and materially changes a language or multimodal agent's future behavior.

        Strong negative results, matched simpler baselines, lifecycle-cost evidence, and provenance/safety analyses are welcome.

  - type: input
    id: paper_title
    attributes:
      label: Paper title
      placeholder: Full paper title
    validations:
      required: true

  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      description: Prefer the canonical paper or preprint page.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true

  - type: input
    id: published
    attributes:
      label: Publication or preprint date
      description: If known.
      placeholder: YYYY-MM-DD

  - type: input
    id: code_url
    attributes:
      label: Code or project URL
      description: Optional; include only a verified official link.
      placeholder: https://github.com/...

  - type: dropdown
    id: lifecycle_stage
    attributes:
      label: Primary memory boundary changed
      description: Choose the closest research problem; this is only a suggestion, not the final taxonomy decision.
      options:
        - Representation & Organization
        - Retrieval & Access
        - Write, Update & Consolidation
        - Memory Learning & Evolution
        - Evaluation & Analysis
    validations:
      required: true

  - type: textarea
    id: memory_role
    attributes:
      label: Why is agent memory substantive here?
      description: Explain what persists or is explicitly managed across steps and how it affects future agent behavior.
      placeholder: The persistent state is ... and it changes later behavior by ...
    validations:
      required: true

  - type: textarea
    id: baseline
    attributes:
      label: Closest baseline or simpler design point
      description: Compared with what should we judge the claimed delta?
      placeholder: Raw history, one-shot retrieval, A-Mem/Mem0/Zep, same trajectory in another representation, no-memory control, etc.
    validations:
      required: true

  - type: textarea
    id: delta
    attributes:
      label: What is the smallest important research delta?
      description: State the narrowest claim that would still make the paper worth adding to the map.
      placeholder: The important change is ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Strongest evidence or ablation
      description: Prefer one decisive experiment, negative control, or matched comparison.
      placeholder: The result to remember is ...
    validations:
      required: true

  - type: textarea
    id: caveats
    attributes:
      label: Negative results or causal confounders
      description: Note unmatched tokens/latency/model changes, missing ablations, weak baselines, limited external validity, or another explanation for the gain.
      placeholder: The strongest alternative explanation is ...

  - type: checkboxes
    id: scope_check
    attributes:
      label: Scope check
      options:
        - label: I believe persistent or managed agent memory is central to this paper's research contribution.
          required: true
