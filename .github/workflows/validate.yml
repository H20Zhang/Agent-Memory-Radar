name: Validate Research Records

on:
  push:
    branches: [main, research-radar-reading-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Test time-first contract
        run: python -m unittest discover -s tests -v
      - name: Validate canonical records
        run: python scripts/validate_canonical.py
      - name: Validate bilingual reading surfaces
        run: python scripts/validate_reading.py
      - name: Validate repository contracts
        run: python scripts/validate.py
