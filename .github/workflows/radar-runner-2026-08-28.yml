name: Apply Aug 28 Agent Memory radar transaction

on:
  push:
    branches: [research-radar-reading-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-radar-reading-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and apply staged transaction
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/radar-finalize-2026-08-28.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          body = src[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/finalize_radar.py').write_text(body, encoding='utf-8')
          PY
          python /tmp/finalize_radar.py
          python scripts/fixup_aug28_staging.py
          python scripts/fixup_aug28_staging_v2.py
          python scripts/fixup_aug28_staging_v3.py
          python scripts/fixup_aug28_staging_v5.py
          rm -f .github/workflows/radar-runner-2026-08-28.yml
          rm -f .github/workflows/radar-finalize-2026-08-28.yml
          rm -f scripts/fixup_aug28_staging_v4.py scripts/fixup_aug28_staging_v5.py
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Run binding repository validators
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_canonical.py
          python scripts/validate_reading.py
          python scripts/validate.py
          git diff --check
      - name: Commit validated transaction to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Aug 28 Agent Memory radar transaction"
          git push origin HEAD:research-radar-reading-v1
