name: Apply staged Agent Memory radar update

on:
  push:
    branches: [research-radar-reading-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-radar-reading-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and apply staged transaction
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/radar-staged-apply.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          body = src[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/apply_radar.py').write_text(body, encoding='utf-8')
          PY
          python /tmp/apply_radar.py
          rm -f .github/workflows/radar-runner.yml
      - name: Repair date-bound test fixtures and Chinese scan layer
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          zh_fixes = [
              (
                  '**问题。** Persistent skill-memory evolution 的增益，能否在配平 skill library 与 retry budget 后仍归因到 state/control 和跨任务 patch？',
                  '**问题。** 持久 skill memory 的增益，能否在配平 skill library 与 retry budget 后，仍归因于 state/control 和跨任务 patch？',
              ),
              (
                  '— verified working state 决定 persistent skill 何时进入 actor，structured trace 再定位后续 patch。',
                  '— 经过验证的 working state 决定 persistent skill 何时进入 actor，structured trace 再定位后续 patch。',
              ),
              (
                  '**证据。** tau2-Retail 为 **58.1 Base / 82.0 WM-only / 65.6 same-library model-controlled / 83.6 Recuris**；evolved package 跨模型把 GPT-5.6 Sol **58.33→76.10**、Claude Opus 5 **72.37→87.94**。',
                  '**证据。** 在 tau2-Retail 上，结果为 **58.1 Base / 82.0 WM-only / 65.6 same-library model-controlled / 83.6 Recuris**；evolved package 跨模型把 GPT-5.6 Sol **58.33→76.10**、Claude Opus 5 **72.37→87.94**。',
              ),
              (
                  '**限制。** Terminal-Bench 在配平四次尝试后只有 **58.6→60.9，p=.774**；SkillFlow 没有 held-out task split，dev gate 功效有限，且 `full evolution lifecycle cost is incomplete`。',
                  '**限制。** 在 Terminal-Bench 上，配平四次尝试后只有 **58.6→60.9，p=.774**；SkillFlow 没有 held-out task split，dev gate 功效有限，且 `full evolution lifecycle cost is incomplete`。',
              ),
          ]
          for old, new in zh_fixes:
              replace('README.md', old, new, 1)

          p = Path('tests/test_memory_v2_contract.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '2026-08-26T00:27:00Z': '2026-08-27T00:34:29Z',
              '2026-08-20—2026-08-26': '2026-08-21—2026-08-27',
              '2026-07-28—2026-08-26': '2026-07-29—2026-08-27',
              '2026-08-26T01:00:00Z': '2026-08-27T01:00:00Z',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing test fixture anchor: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          replace(
              'tests/test_validate_reading.py',
              'EXPECTED_TIMELINE_TITLES = {\n    "2608-23471": "2026-08-26 · InjecMEM",',
              'EXPECTED_TIMELINE_TITLES = {\n    "2608-24876": "2026-08-27 · Recuris",\n    "2608-23471": "2026-08-26 · InjecMEM",',
              1,
          )
          PY
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Run binding repository validators
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_canonical.py
          python scripts/validate_reading.py
          python scripts/validate.py
      - name: Commit validated transaction to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stage Recuris memory evolution signal"
          git push origin HEAD:research-radar-reading-v1
