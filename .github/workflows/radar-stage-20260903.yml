name: Stage Agent Memory Radar 2026-09-03

on:
  push:
    branches: [radar-maintenance-publish-20260903]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-maintenance-publish-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Apply research transaction
        run: python scripts/.radar_apply_20260903.py
      - name: Test time-first contract
        run: python -m unittest discover -s tests -v
      - name: Validate canonical records
        run: python scripts/validate_canonical.py
      - name: Validate bilingual reading surfaces
        run: python scripts/validate_reading.py
      - name: Validate repository contracts
        run: python scripts/validate.py
      - name: Commit staged validated tree
        run: |
          rm scripts/.radar_apply_20260903.py
          rm .github/workflows/radar-stage-20260903.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No staged material change"; exit 1; }
          git commit -m "Stage Agent Zero Memory radar update"
          git push origin HEAD:radar-maintenance-publish-20260903
