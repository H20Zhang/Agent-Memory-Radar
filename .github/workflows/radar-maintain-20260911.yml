name: Stage Agent Memory Radar maintenance

on:
  push:
    branches: [radar-maintain-20260911]

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-maintain-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: pip install -r requirements.txt
      - name: Freeze main, apply accepted research, validate, and stage atomic candidate
        env:
          FROZEN_MAIN: 6e93856b8c2a89ba5a18aa1fa0625b49eb090028
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FROZEN_MAIN"
          cp scripts/.radar_apply_20260911.py /tmp/radar_apply.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/radar_apply.py')
          t=p.read_text()
          t=t.replace("timefirst:area={area.lower().replace(' ','-')}", "timefirst:area={area_map[pid]}")
          t=t.replace("marker='| **Weekly** |'", "marker='| **Weekly** |' if path.name=='README.md' else '| **周度** |'")
          t=t.replace("row='| **周报** |", "row='| **周度** |")
          t=t.replace("t=t.replace('W35 与 2026-08 月报已经封存','W36、W35 与 2026-08 月报已经封存')", "t=t.replace('W35 与 2026-08 月报均已按周期关闭。','W36、W35 与 2026-08 月报均已按周期关闭。')")
          p.write_text(t)
          PY
          git checkout --detach "$FROZEN_MAIN"
          export RADAR_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python /tmp/radar_apply.py
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import os, re

          ts=os.environ['RADAR_TS']
          late=(datetime.strptime(ts, '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc)+timedelta(seconds=1)).strftime('%Y-%m-%dT%H:%M:%SZ')

          ids=['2609-08273','2609-08279','2609-10263']
          heading_witness={
              'MemForest':'event structured posthoc compression',
              'What Eviction Destroys':'restore counterfactual eviction audit',
              'RD-Forget':'query conditioned storage use separation',
          }
          for name in ('README.md','README.en.md'):
              p=Path(name); text=p.read_text()
              blocks={}
              for ident in ids:
                  pat=rf'<a id="entry-{ident}"></a>\n<details>.*?</details>\n\n'
                  m=re.search(pat,text,re.S)
                  if not m:
                      raise SystemExit(f'missing generated timeline block {ident} in {name}')
                  blocks[ident]=m.group(0)
                  text=text[:m.start()]+text[m.end():]
              marker='<a id="entry-2608-29606"></a>'
              text=text.replace(marker,''.join(blocks[i] for i in ids)+marker,1)
              for label,witness in heading_witness.items():
                  text=text.replace(f'- **`new_signal` · {label} ·',f'- **`new_signal` · {witness} · {label} ·')
              if name=='README.md':
                  text=text.replace('“存储”和“当前允许使用”值得分开评测；单篇论文不足以形成稳定遗忘方向。','存储状态和当前使用权限值得分开评测；单篇论文不足以形成稳定遗忘方向。')
                  text=text.replace('AGPR 与压缩同时改变读取，语言模型融合还可能损失来源和冲突状态，且缺少持续分区与合并的完整维护成本，即','其中 AGPR 与压缩同时改变读取，语言模型融合还可能损失来源和冲突状态，且缺少持续分区与合并的完整维护成本，即')
              p.write_text(text)

          p=Path('tests/test_memory_v2_contract.py'); text=p.read_text()
          text=text.replace('2026-08-28T00:30:00Z','2026-09-10T00:30:00Z')
          text=text.replace('radar_published_at: str = "2026-09-10T00:30:00Z"',f'radar_published_at: str = "{ts}"')
          text=text.replace('2026-08-28T00:31:00Z','2026-09-10T00:31:00Z')
          text=text.replace('2026-09-03T01:19:15Z',ts)
          text=text.replace('2026-09-03T23:59:59Z',late)
          text=text.replace('2026-08-28—2026-09-03','2026-09-05—2026-09-11')
          text=text.replace('2026-08-05—2026-09-03','2026-08-13—2026-09-11')
          p.write_text(text)

          p=Path('tests/test_validate_reading.py'); text=p.read_text()
          needle='EXPECTED_TIMELINE_TITLES = {\n'
          addition=(
              '    "2609-08273": "2026-09-11 · MemForest",\n'
              '    "2609-08279": "2026-09-11 · What Eviction Destroys",\n'
              '    "2609-10263": "2026-09-11 · RD-Forget",\n'
          )
          if '"2609-08273"' not in text:
              text=text.replace(needle,needle+addition,1)
          p.write_text(text)
          PY
          python -m unittest discover -s tests -v
          python scripts/validate_canonical.py
          python scripts/validate_reading.py
          python scripts/validate.py
          git diff --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$FROZEN_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Agent Memory radar through 2026-09-11'
          git push origin HEAD:radar-candidate-20260911
