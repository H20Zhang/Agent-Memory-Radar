          eal_en = r'''# Agent Memory Is a Surface for Endogenous Authorization Laundering

[← Latest Papers](../../README.en.md#latest-papers) · [Research Map](../../README.en.md#field-map) · [Evaluation & Analysis](../../categories/evaluation-analysis.md) · [中文](2609.01836.zh.md)

**Paper:** [arXiv:2609.01836](https://arxiv.org/abs/2609.01836) · **Published:** 2026-09-01 · **Importance:** 4/5

> **Research delta.** EAL-Bench turns authorization-state integrity into a memory lifecycle measurement: it separates false authority formed during repeated writes from downstream propagation, then replaces only memory to test whether the stored artifact causally drives unauthorized action.

## Problem

Persistent memory can become an agent's effective authorization policy. A forgotten revocation, broadened scope, or non-authoritative statement absorbed into memory can make a later tool action look authorized even when the underlying history never granted it.

## Mechanism

Each case has an evolving organizational history and a hidden deterministic ledger. A writer maintains bounded free-text or typed memory either one-shot or incrementally; an executor later sees only frozen memory plus a matched request. Authorized and unauthorized requests differ in one authorization-relevant field. The benchmark measures false-authority formation separately from propagation, qualifies executors on faithful-memory controls, and applies an exact-state repair that swaps only the memory while request, executor, tools, and canonical state stay fixed. It also tests source-authority gating and bounded event sourcing as safeguards.

## Compared with

The closest predecessor is **AuthMem-Bench**, which varies source authority while holding a claim and downstream task fixed. EAL-Bench adds repeated grant/revocation/replacement updates, long-horizon state, separate formation versus propagation, and exact memory repair. The strongest causal control is therefore not a cross-system leaderboard: it is the same executor/request/tool state with naturally erroneous memory versus an oracle-exact replacement. The two safeguards are architecture-level interventions and should be judged with their legitimate-use cost, not credited as isolated components.

## Decisive evidence

With typed incremental updates, false-authority formation reaches **28.3% procurement / 10.4% cybersecurity / 50.2% finance**, while downstream unauthorized submission is **28.9 / 10.4 / 51.0%**. More decisively, naturally generated erroneous typed memories cause calibrated executors to take the unauthorized action in **98.6%** of matched replays; replacing only memory with exact canonical state reduces that behavior to **0%**. This is unusually direct evidence that stored state, not executor unreliability, changes later action. The source-authority gate reduces pooled unauthorized submission **25.3→7.3%**, and bounded event sourcing to **9.0%**, but authorized use falls **93.3→53.8% / 64.7%**.

## Main caveat

This is a controlled mechanism study, not a prevalence estimate. Histories and ledgers are synthetic and structured; deterministic formation labels apply only to typed memory. The safeguards bundle different architectural changes, assume usable authority/version metadata, and trade safety against legitimate utility. Production storage growth, update latency, maintenance, deletion/revocation, privacy, and recovery cost are not lifecycle-matched.

## Memory lifecycle

`authentic history → bounded one-shot/incremental write → free-text or typed authorization state → frozen memory-only executor view → tool action → exact repair / authority gate / event-sourced update → governance and lifecycle cost`

The measured failure sits at **update/governance → later action**: a wrong persistent authorization state can survive into a faithful executor and become an operational permission.

## Why it matters

The field should stop treating memory correctness as recall alone. When persistent state carries permissions, **state integrity is policy integrity**. The next decisive design freezes writer, executor, task, tool surface, and budget, then independently varies update semantics, provenance/authority enforcement, and derived-state representation while measuring both unauthorized and legitimate action plus full lifecycle cost.

## Related reading

[AuthMem-Bench](2608.01679.md) isolates source-authority collapse at consolidation; [StateMem](2608.19652.md) studies superseded current state; [When Stale Constraints Go Unchecked](2608.25553.md) isolates verification allocation under a fixed budget. EAL-Bench extends that line by showing that a wrong authorization state can be repaired in memory alone and thereby remove the downstream violation.
'''

          eal_zh = r'''# Agent Memory Is a Surface for Endogenous Authorization Laundering：持久记忆中的授权漂白

[← 最新论文](../../README.md#latest-papers) · [领域地图](../../README.md#field-map) · [Evaluation & Analysis](../../categories/zh/evaluation-analysis.md) · [English](2609.01836.md)

**论文：** [arXiv:2609.01836](https://arxiv.org/abs/2609.01836) · **发布日期：** 2026-09-01 · **重要性：** 4/5

> **研究增量。** EAL-Bench 把“授权状态是否被记忆正确维护”变成独立的生命周期测量：先区分错误权限在反复写入中如何形成，再看它是否传播到后续工具动作，最后只替换 memory 来验证持久状态本身是否是因果路径。

## 问题

持久记忆可能事实上变成 Agent 的授权策略。一次被遗忘的撤销、被放大的权限范围，或被误当权威来源的普通记录，都可能让后续工具动作在 memory 中显得“有权限”，即使真实历史从未授予这项权限。

## 机制

每个样例都包含持续演化的组织历史和一个隐藏的确定性授权账本。writer 以 one-shot 或 incremental 方式维护有容量上限的自由文本/结构化记忆；executor 之后只能看到冻结的 memory 与当前请求。成对的合法/非法请求只差一个与授权相关的字段。评测分别测 false-authority formation 与 downstream propagation；executor 必须先通过 faithful-memory 校准。最关键的干预是 exact-state repair：固定请求、executor、工具与真实授权状态，只把错误 memory 替换成 oracle-exact state。论文还测试了来源权威 Gate 与 bounded event sourcing 两种防护。

## 与什么比较

最近的前序工作是 **AuthMem-Bench**：它固定 claim 与下游任务，只改变来源权威；EAL-Bench 进一步覆盖 grant/revocation/replacement 的反复更新、长周期状态、formation 与 propagation 分解，以及 memory-only exact repair。因此最强的因果对照不是跨系统榜单，而是**同一个 executor / request / tool state 下，仅替换持久记忆**。两种防护都改变了系统架构，并且牺牲合法请求通过率，不能把整套收益归给某一个小组件。

## 决定性证据

在 typed incremental 更新中，错误权限形成率达到 **采购 28.3% / 网络安全 10.4% / 金融 50.2%**，对应非法动作提交率为 **28.9 / 10.4 / 51.0%**。更关键的是，对自然生成且已确认存在错误权限的 typed memory，校准后的 executor 在 **98.6%** 的匹配 replay 中执行非法动作；只把 memory 换成精确真实状态后降到 **0%**。这直接说明后续行为由持久状态改变，而不是 executor 自身不可靠。来源权威 Gate 将汇总非法提交率从 **25.3% 降到 7.3%**，bounded event sourcing 降到 **9.0%**；与此同时合法使用率从 **93.3%** 降到 **53.8% / 64.7%**。

## 主要限制

这是一项受控机制研究，不是线上发生率估计。历史与账本是合成且结构化的；只有 typed memory 能直接得到确定性的 formation label。两种防护同时改变不同架构边界，需要已有的 authority/version metadata，并形成明显的安全—效用权衡。生产环境中的存储增长、更新延迟、维护、删除/撤销、隐私与恢复成本没有做完整生命周期配平。

## 记忆生命周期

`真实历史 → 有界 one-shot / incremental 写入 → 自由文本或结构化授权状态 → executor 只读冻结 memory → 工具动作 → exact repair / authority gate / event-sourced update → 治理与生命周期成本`

这里测到的关键边界是 **更新/治理 → 后续动作**：一旦错误授权进入持久状态，即使 executor 完全忠实于它，仍会把错误状态转成真实权限动作。

## 为什么重要

记忆正确性不能只按 recall 理解。当 persistent state 携带权限时，**状态完整性就是策略完整性**。下一步应固定 writer、executor、任务、工具面与预算，分别干预更新语义、来源/授权约束和派生状态表示，并同时报告非法动作、合法效用与完整生命周期成本。

## 相关阅读

[AuthMem-Bench](2608.01679.md) 隔离了 consolidation 时的来源权威丢失；[StateMem](2608.19652.zh.md) 处理 superseded current state；[When Stale Constraints Go Unchecked](2608.25553.zh.md) 在固定预算下隔离 freshness verification allocation。EAL-Bench 再向前一步：只修复 memory 就能消除下游非法动作。
'''

          inv_en = r'''# Invalidation Contracts for Cross-Episode Agent Memory

[← Latest Papers](../../README.en.md#latest-papers) · [Research Map](../../README.en.md#field-map) · [Write, Update & Consolidation](../../categories/write-update-consolidation.md) · [中文](2609.00243.zh.md)

**Paper:** [arXiv:2609.00243](https://arxiv.org/abs/2609.00243) · **Published:** 2026-08-31 · **Importance:** 4/5

> **Research delta.** Invalidation Contracts make staleness an explicit cross-episode memory contract and separate three variables that headline token savings often mix: the value of remembering a recovery procedure, whether it remains valid after server drift, and whether the planner actually complies with valid memory.

## Problem

Agents can cache a recovery suggestion from one API episode and reuse it later, avoiding repeated reasoning. But external server state can drift independently of the agent. A stale procedure then becomes silent persistent state; re-deriving on every episode restores correctness by forfeiting memory's reuse savings.

## Mechanism

The server attaches cacheability and version dependencies to recovery suggestions. A client keeps successful suggestions across episodes and checks those dependencies before exposing memory to the planner. The paper distinguishes **validity**—whether cached advice is still correct—from **compliance**—whether the model applies valid advice on its first attempt. The A0/A1/A2/A2D ladder compares no memory, memory without invalidation, table-level invalidation, and row-level differential invalidation across fixed models and serving paths.

## Compared with

The critical attribution control is **A0 no memory versus A1 memory/no invalidation**: naive memory already saves tokens, so the full 29–33% saving cannot be credited to invalidation. **A1/A2/A2D** then asks what invalidation granularity adds under the same model/path protocol. Token totals are only compared within the same model and serving path because providers and tokenizers differ. Row-level validity is an oracle-quality protocol signal in this benchmark, not proof that production systems can cheaply expose equally precise dependencies.

## Decisive evidence

Across seven models, three serving paths, two domains, and roughly **9,400 episodes**, naive memory saves about **5–28%** tokens over no memory. Row-level invalidation then raises post-drift first-try compliance by **0–66.7pp** across models, including **55.6–66.7pp** on three, while table-level invalidation sends the affected post-drift rate to **0% on five of seven models** by evicting co-located valid entries. Row-level eviction precision is **1.00** under the benchmark's row oracle. The full row-level arm recovers **29–33%** of no-memory baseline token cost on four of seven models, but that total mixes basic memory reuse with invalidation. The contract adds about **15%** response payload.

## Main caveat

The environment contains two synthetic hand-written APIs and controlled drift. Dependency precision is provided by the protocol rather than learned under noisy production state. Identical valid bytes still produce sharply different compliance across models, so version correctness is not behavior correctness. Payload, storage, validity-check latency, security, maintenance, and deletion costs are not fully lifecycle-matched.

## Memory lifecycle

`API failure → recovery suggestion → cross-episode persistent cache + version dependencies → validity check → planner exposure/compliance → server drift → row/table invalidation → retained valid memory / eviction → maintenance cost`

The main boundary is **update/forget**: external state can invalidate a procedure without the memory store itself observing a new user episode.

## Why it matters

Memory systems need a first-class answer to “what makes this stored procedure stop being true?” The important decomposition is **reuse × validity × compliance**. Future experiments should hold task/model/path budget fixed, compare no-memory and memory-only controls, then independently vary dependency precision and invalidation scope while charging the full checking and maintenance path.

## Related reading

[StateMem](2608.19652.md) studies supersession inside maintained user state; [When Stale Constraints Go Unchecked](2608.25553.md) asks where a fixed verification budget should go; [EAL-Bench](2609.01836.md) shows the higher-stakes case where stale or broadened permission state becomes an authorization policy. Invalidation Contracts supplies a protocol-level mechanism for state whose validity depends on an external versioned world.
'''

          inv_zh = r'''# Invalidation Contracts for Cross-Episode Agent Memory：跨 Episode 记忆的失效契约

[← 最新论文](../../README.md#latest-papers) · [领域地图](../../README.md#field-map) · [Write, Update & Consolidation](../../categories/zh/write-update-consolidation.md) · [English](2609.00243.md)

**论文：** [arXiv:2609.00243](https://arxiv.org/abs/2609.00243) · **发布日期：** 2026-08-31 · **重要性：** 4/5

> **研究增量。** Invalidation Contracts 把“什么时候一条跨 episode 记忆已经失效”做成显式契约，并拆开 headline token saving 经常混在一起的三个变量：记住 recovery procedure 本身的价值、外部状态漂移后它是否仍有效，以及 planner 是否真的会使用仍然有效的记忆。

## 问题

Agent 可以把一次 API 失败后的恢复办法持久化，在后续 episode 直接复用，从而避免重复推理。但外部 server state 可以独立变化；此时 cached procedure 会静默变旧。每次都重新推导当然更安全，却会把记忆原本节省的成本全部还回去。

## 机制

服务端给 recovery suggestion 附加 cacheability 与版本依赖；客户端跨 episode 保留成功的建议，并在暴露给 planner 前先检查依赖是否仍有效。论文明确区分 **validity**（建议在漂移后是否仍正确）与 **compliance**（模型是否在第一次尝试中采用有效建议）。A0/A1/A2/A2D 控制链分别对应无记忆、只有跨 episode 记忆、table-level 失效、row-level differential 失效，并在固定模型与 serving path 内比较。

## 与什么比较

归因上最关键的是 **A0 无记忆 vs. A1 有记忆但无失效机制**：A1 本身已经节省 token，因此完整 A2D 的 29–33% 总节省不能全部记在 invalidation 名下。接着用 **A1/A2/A2D** 隔离失效粒度。由于不同 provider/tokenizer 不可直接比较，token 只在同一个模型和 serving path 内对照。row-level validity 在该实验里接近 oracle protocol signal，不能自动外推为生产系统能低成本获得同样精确的 dependency scope。

## 决定性证据

七个模型、三条 serving path、两个 domain、约 **9,400 个 episode** 中，只有跨 episode memory、没有 invalidation 时，相对无记忆已经节省约 **5–28% token**。在相同模型/路径协议下，row-level invalidation 让漂移后的 first-try compliance 提高 **0–66.7 个百分点**，其中三个模型提高 **55.6–66.7 个百分点**；table-level invalidation 因为连同同表有效条目一起删除，使五个模型的受影响 post-drift rate 变成 **0%**。row-level eviction precision 在论文的 row oracle 下为 **1.00**。完整 A2D 在四个模型上回收无记忆基线 **29–33%** 的 token 成本，但这包含了“有记忆”与“会失效”的共同贡献。协议本身增加约 **15%** response payload。

## 主要限制

环境只有两个手工构造的合成 API，并且漂移是受控注入的。dependency precision 由协议直接给出，而不是在噪声生产状态中学习。即使 wire bytes 完全相同且 memory 有效，不同模型的 compliance 仍差异很大，因此版本正确不等于行为正确。payload、存储、有效性检查延迟、安全、维护与删除成本也没有完整配平。

## 记忆生命周期

`API 失败 → recovery suggestion → 跨 episode 持久缓存 + version dependency → validity check → 暴露给 planner / compliance → server drift → row/table invalidation → 保留有效记忆 / 淘汰失效记忆 → 维护成本`

关键边界在 **更新/遗忘**：外部世界发生变化时，即使 Agent 本身没有新的用户 episode，一条程序性记忆也可能已经失效。

## 为什么重要

记忆系统必须回答一个长期被忽略的问题：**什么条件会让这条 procedure 不再成立？** 真正要拆开的变量是 **复用 × 有效性 × compliance**。下一步应固定任务、模型、serving path 与预算，先用 no-memory / memory-only 控制，再独立变化 dependency precision 和 invalidation scope，并把检查、维护与淘汰成本全部计入。

## 相关阅读

