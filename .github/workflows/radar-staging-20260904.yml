          write('library/README.en.md', lib_en)

          # Category projections: benchmark/failure analysis for EAL, update/forget system contract for invalidation.
          cat = ROOT / 'categories/evaluation-analysis.md'
          t = cat.read_text(encoding='utf-8')
          t = replace_once(t, '## Current argument\n\n', '## Current argument\n\n**EAL-Bench** adds a stronger authorization-state intervention: it separates false authority formed during repeated memory updates from downstream propagation, then repairs only the memory while keeping executor, request, tools, and canonical state fixed. Naturally erroneous typed memories drive unauthorized action in 98.6% of matched replays; exact replacement drops that behavior to 0%. The mechanism is strong, but the synthetic histories and safety–utility cost of the mitigations keep it an early signal rather than a durable map change.\n\n', 'evaluation category argument')
          table_marker = '|---|---|---|---:|---|\n'
          row = '| 2026-09-01 | [EAL-Bench](../papers/2026/2609.01836.md) | `semantic` `text` `structured` `general-agent` | 4/5 | Memory-only exact repair localizes authorization failures to persistent state; mitigation reduces violations but also rejects legitimate actions. |\n'
          t = replace_once(t, table_marker, table_marker + row, 'evaluation category row')
          write(cat, t)

          cat = ROOT / 'categories/zh/evaluation-analysis.md'
          t = cat.read_text(encoding='utf-8')
          t = replace_once(t, '## 当前判断\n\n', '## 当前判断\n\n**EAL-Bench** 把授权状态完整性推进到更直接的干预：先区分错误权限在反复更新中形成还是在 executor 端传播，再固定 request / executor / tools / canonical state，只替换 memory。自然生成的错误 typed memory 让非法动作率达到 98.6%，精确修复持久状态后降到 0%。这个因果链很强，但合成历史和防护带来的合法效用损失决定了它仍是 early signal。\n\n', 'zh evaluation argument')
          write(cat, t)

          cat = ROOT / 'categories/write-update-consolidation.md'
          t = cat.read_text(encoding='utf-8')
          t = replace_once(t, '## Current argument\n\n', '## Current argument\n\n**Invalidation Contracts** adds a separate update/forget contract for state whose truth depends on an external versioned world. The A0/A1/A2/A2D ladder matters because memory without invalidation already saves 5–28% tokens; row-level invalidation then preserves unaffected entries and changes post-drift compliance under the same model/path, so reuse value and invalidation value should not be conflated.\n\n', 'write category argument')
          row = '| 2026-08-31 | [Invalidation Contracts](../papers/2026/2609.00243.md) | `procedural` `structured` `general-agent` | 4/5 | Versioned row-level invalidation preserves unaffected cross-episode procedures; naive memory already saves tokens, so total savings must be split into reuse, validity, and compliance. |\n'
          t = replace_once(t, table_marker, table_marker + row, 'write category row')
          write(cat, t)

          cat = ROOT / 'categories/zh/write-update-consolidation.md'
          t = cat.read_text(encoding='utf-8')
          t = replace_once(t, '## 当前判断\n\n', '## 当前判断\n\n**Invalidation Contracts** 增加了一个不同于 supersession 的 update/forget contract：一条 procedure 的真实性可能因为外部版本变化而失效。A0/A1/A2/A2D 控制链尤其重要，因为没有 invalidation 的跨 episode memory 已经节省 5–28% token；row-level invalidation 的额外价值应与“单纯记住了”分开归因，并继续受 model compliance 与维护成本约束。\n\n', 'zh write argument')
          write(cat, t)

          # Advance the exact time-first cutoff and rolling windows. Unit-test fixture literals move with the public contract.
          vr = ROOT / 'scripts/validate_reading.py'
          t = vr.read_text(encoding='utf-8')
          t = replace_once(t, 'SYNTHESIS_TIMESTAMP = "2026-09-03T01:19:15Z"', f'SYNTHESIS_TIMESTAMP = "{RADAR_TIME}"', 'validator synthesis')
          t = replace_once(t, '(date(2026, 8, 28), date(2026, 9, 3))', '(date(2026, 8, 29), date(2026, 9, 4))', 'validator 7d window')
          t = replace_once(t, '(date(2026, 8, 5), date(2026, 9, 3))', '(date(2026, 8, 6), date(2026, 9, 4))', 'validator 30d window')
          write(vr, t)

          test = ROOT / 'tests/test_memory_v2_contract.py'
          t = test.read_text(encoding='utf-8')
          t = t.replace('2026-09-03T01:19:15Z', RADAR_TIME)
          t = t.replace('2026-08-28—2026-09-03', '2026-08-29—2026-09-04')
          t = t.replace('2026-08-05—2026-09-03', '2026-08-06—2026-09-04')
          # Only update explicit expected public-window tuples; do not rewrite arbitrary fixture acceptance dates.
          t = t.replace('(date(2026, 8, 28), date(2026, 9, 3))', '(date(2026, 8, 29), date(2026, 9, 4))')
          t = t.replace('(date(2026, 8, 5), date(2026, 9, 3))', '(date(2026, 8, 6), date(2026, 9, 4))')
          write(test, t)
          PY
      - name: Run every test and validator
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_canonical.py
          python scripts/validate_reading.py
          python scripts/validate.py
      - name: Commit validated staging tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md library categories data/papers papers/2026 scripts/validate_reading.py tests/test_memory_v2_contract.py
          git commit -m 'Stage Sep 4 Agent Memory radar transaction'
          git push origin HEAD:radar-staging-20260904
